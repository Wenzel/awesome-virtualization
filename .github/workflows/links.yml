name: Links

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["**.md"]

jobs:
  links:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        id: lychee
        with:
          # 403 and 429: Intel, SlideShare and Core Security block automated clients
          args: --no-progress --accept 200,206,403,429 README.md
          fail: ${{ github.event_name == 'pull_request' }}
      - if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links
          content-filepath: ./lychee/out.md
